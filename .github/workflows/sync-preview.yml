name: Sync homepage v1 preview

on:
  push:
    paths:
      - ".github/workflows/sync-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror Cloudflare preview into this user site
        run: |
          set -euo pipefail
          mkdir -p /tmp/typedb-preview
          wget --recursive --level=5 --no-parent --no-host-directories \
            --page-requisites --execute robots=off \
            --directory-prefix=/tmp/typedb-preview \
            https://typedb-homepage-v1.pages.dev/
          # wget --no-host-directories writes into the prefix, not a hostname folder
          rsync -a --delete \
            --exclude .git --exclude .github --exclude README.md \
            /tmp/typedb-preview/ ./
          # wget keeps query strings in some filenames; copy a clean favicon
          if [ -f "favicon.ico?favicon.2c2-eipfoyeh2.ico" ]; then
            cp "favicon.ico?favicon.2c2-eipfoyeh2.ico" favicon.ico
          fi
          touch .nojekyll
      - name: Commit preview
        run: |
          set -euo pipefail
          git config user.name "homepage-v1-preview"
          git config user.email "daniel.me.crowe@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview files to commit"
            exit 0
          fi
          git commit -m "Sync TypeDB homepage v1 preview [skip ci]"
          git push
